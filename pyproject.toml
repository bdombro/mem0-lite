[project]
name = "mem0-lite"
version = "0.1.0"
description = "Local mem0 memory for coding agents via MCP"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9,<2",
    "mem0ai>=2.0.18,<3",
    "portalocker>=2.8",
]

[project.scripts]
mem0-lite = "mem0_lite.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["mem0_lite", "plugins"]
python_files = ["*_test.py"]
addopts = ["-ra", "--strict-config"]
filterwarnings = [
    "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
]

[tool.hatch.build.targets.wheel]
exclude = ["**/*_test.py", "**/conftest.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
