[project]
name = "mem0-lite"
version = "0.1.0"
description = "Local mem0 memory for coding agents via MCP"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9,<2",
    "mem0ai>=1.0",
    "portalocker>=2.8",
]

[project.scripts]
mem0-lite = "mem0_lite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
